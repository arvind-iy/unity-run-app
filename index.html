<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>Unity Run & Ride - Bib Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="login-container">
        <div class="logo">🏃</div>
        <h1>Unity Run & Ride</h1>
        <p class="subtitle">Bib Management System</p>
        
        <div class="button-group">
            <button onclick="window.location.href='app.html'" class="btn btn-primary">
                👤 Staff Login - Bib Assignment
            </button>
            <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary">
                📊 Admin Dashboard
            </button>
        </div>
        
        <div class="info-box">
            <h3>🔐 Authentication Required</h3>
            <p>You'll be asked to sign in with Google to access the system.</p>
            <p><strong>Version 2.0</strong> - Powered by Google Sheets API</p>
        </div>
    </div>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 28px;
            color: #1e293b;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #64748b;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 18px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #10b981;
        }
        
        .btn-secondary:hover {
            background: #059669;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
        }
        
        .info-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            color: #64748b;
        }
        
        .info-box h3 {
            color: #1e293b;
            font-size: 16px;
            margin-bottom: 10px;
        }
        
        .info-box p {
            margin-bottom: 8px;
        }
    </style>
</body>
</html>
