<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <title>Bib Assignment - Unity Run & Ride</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <h1>🏃 Unity Run & Ride</h1>
                <p>Bib Assignment</p>
            </div>
            <div class="header-right">
                <div id="connectionStatus" class="status-badge offline">
                    <span class="status-dot"></span>
                    <span id="statusText">Offline</span>
                </div>
                <button id="signOutBtn" class="btn-icon" title="Sign Out" style="display:none">
                    🚪
                </button>
            </div>
        </header>

        <!-- Auth Section -->
        <div id="authSection" class="auth-section">
            <div class="auth-card">
                <h2>🔐 Sign In Required</h2>
                <p>Please sign in with your Google account to access the bib assignment system.</p>
                <button id="signInBtn" class="btn btn-primary">
                    Sign in with Google
                </button>
            </div>
        </div>

        <!-- Main App (hidden until signed in) -->
        <div id="mainApp" style="display:none;">
            <!-- Setup Form -->
            <div class="setup-section">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="venueSelect">📍 Venue</label>
                        <select id="venueSelect" required>
                            <option value="">Select Venue</option>
                            <option value="Main Stadium">Main Stadium</option>
                            <option value="Registration Tent">Registration Tent</option>
                            <option value="Expo Hall">Expo Hall</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="deskSelect">🖥️ Desk Number</label>
                        <select id="deskSelect" required>
                            <option value="">Select Desk</option>
                            <option value="1">Desk 1</option>
                            <option value="2">Desk 2</option>
                            <option value="3">Desk 3</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="staffName">👤 Your Name</label>
                        <input type="text" id="staffName" placeholder="Enter your name" required>
                    </div>
                </div>
            </div>

            <!-- Search Section -->
            <div class="search-section">
                <h2>🔍 Search Participant</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search by Phone, Email, Name, or Sr. No." autocomplete="off">
                    <button id="searchBtn" class="btn btn-primary">Search</button>
                </div>
                <div id="searchHint" class="hint">
                    💡 Tip: Enter at least 3 characters to search
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" style="display:none;">
                <h3>Search Results</h3>
                <div id="resultsContainer"></div>
            </div>

            <!-- Assignment Form -->
            <div id="assignmentSection" style="display:none;">
                <div class="assignment-card">
                    <h3>📝 Assign Bib Number</h3>
                    <div id="participantInfo" class="participant-info"></div>
                    <div class="form-group">
                        <label for="bibInput">Bib Number</label>
                        <input type="text" id="bibInput" placeholder="Enter bib number" autocomplete="off">
                        <div id="bibHint" class="hint"></div>
                    </div>
                    <div class="button-group">
                        <button id="assignBtn" class="btn btn-primary">✓ Assign Bib</button>
                        <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Offline Queue -->
            <div id="offlineQueue" style="display:none;" class="offline-queue">
                <h4>📦 Offline Queue</h4>
                <p id="queueCount">0 pending assignments</p>
                <div class="button-group">
                    <button id="syncBtn" class="btn btn-small">🔄 Sync Now</button>
                    <button id="clearQueueBtn" class="btn btn-small" style="background: #dc2626;">🗑️ Clear Queue</button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
            <p id="loadingText">Loading...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js"></script>
    <script src="js/sheets-api.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
